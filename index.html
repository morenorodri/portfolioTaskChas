<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- font family pack from 'google fonts' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- CSS files in order. consistent, specific and unique designs. -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/home.css">

    <title> Portfolio Task </title>
</head>
<body>
    
    <header>
        <nav aria-label="main menu">
            <div class="nav-wrapper">
                <!-- brandmark logo -->
                <a href="/" class="nav-brand-box">
                    <img src="./img/icon/face-icon.svg" alt="student - homepage">
                </a>
            

                <!-- links for page categories and social media -->
                <div class="nav-links">
                    <ul class="nav-link-list">
                        <li><a href="#"> home  </a></li>
                        <li><a href="#"> about me</a></li>
                        <li><a href="#"> tech stacks </a></li>
                        <li><a href="#"> projects </a></li>
                        <li><a href="#"> contact </a></li>
                    </ul>

                    <ul class="nav-social-list">
                        <li><a href="#" aria-label="linkedin profile">
                            <img src="./img/logo/github-logo.svg" alt="" aria-hidden="true">
                        </a></li>
                        <li><a href="#" aria-label="github profile">
                            <img src="./img/logo/linkedin-logo.svg" alt="" aria-hidden="true">
                        </a></li>
                        <li><a href="#" aria-label="instagram profile">
                            <img src="./img/logo/x-logo.svg" alt="" aria-hidden="true">
                        </a></li>
                    </ul>
                </div>


                <!-- buttons for theme mode and drop menu action -->
                <div class="nav-action">
                    <button type="button" aria-label="toggle the dropdown menu">
                        <img src="./img/icon/moon-icon.svg" alt="" aria-hidden="true"> 
                    </button>      
                    <button type="button" aria-label="toggle the dropdown menu" popovertarget="mainMenu">
                        <img src="./img/icon/menu-icon.svg" alt="" aria-hidden="true"> 
                    </button>      
                </div>                
            </div>


            <!-- dropdown menu includes links for page categories and social media -->
            <div id="mainMenu" class="menu-links" popover="auto">
                <ul class="menu-link-list">
                    <li><a href="#"> home </a></li>
                    <li><a href="#"> about me </a></li>
                    <li><a href="#"> tech stacks </a></li>
                    <li><a href="#"> projects </a></li>
                    <li><a href="#"> contact </a></li>
                </ul>

                <ul class="menu-social-list">
                    <li><a href="#" aria-label="linkedin profile">
                        <img src="./img/logo/github-logo.svg" alt="" aria-hidden="true">
                    </a></li>
                    <li><a href="#" aria-label="github profile">
                        <img src="./img/logo/linkedin-logo.svg" alt="" aria-hidden="true">
                    </a></li>
                    <li><a href="#" aria-label="instagram profile">
                        <img src="./img/logo/x-logo.svg" alt="" aria-hidden="true">
                    </a></li>
                </ul>
            </div>
        </nav>
    </header>


    <main>
        <section class="main-display">
            <div class="display-wrapper">
                <div class="dplay-frame">
                    <img src="./img/avatar.png" alt="profile picture">
                </div>
                <h1>
                    Hi 👋 <br>
                    My name is <br>
                    Winfer Rodri Flor <br>
                    I build things for web <br>
                </h1>
            </div>
        </section>
    </main>


    <footer>
        <section class="main-footer">
            <div class="footer-wrapper">
                <p> 
                    Coded by Winfer Rodri Flor, <br>
                    with dedication, ambition, <br>
                    and some of yerba mate. 
                </p>
            </div>
        </section>
    </footer>

</body>
</html>
